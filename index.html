<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yanushi de Mel</title>
<!--
  ============================================================
  ADDING YOUR SCREENSHOTS
  Create a folder called "images" next to this file and drop
  screenshots in with these exact names:
    images/climate-etl.png
    images/pink-ribbon.png
    images/pilates-agent.jpg
    images/inclusive-fintech.png
    images/blockchain-payments.png
    images/agile-delivery.png
  Until an image exists, a designed gradient cover shows
  instead, so the site never looks broken.

  ADDING YOUR LINKS
  Search for "REPLACE_ME" in the PROJECTS array below.
  A URL string renders a button, "soon" renders a dashed
  placeholder, null hides the button entirely.
  ============================================================
-->
<style>
  :root{
    --ink:#101014;
    --grey:#5f5f66;
    --light:#e7e7e9;
    --bg:#fafaf7;
    --card:#ffffff;
    --blue:#1f2ff0;
    --blue-dark:#131fb8;
    --blue-tint:#eef0ff;
    --maxw:1080px;
    --navh:62px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:clip;width:100%;overscroll-behavior-x:none;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.6;
    overflow-x:clip;width:100%;max-width:100vw;overscroll-behavior-x:none;
  }
  a{color:inherit;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%;}

  /* ---------- Full-page snap (desktop only) ---------- */
  section, .hero-page, .foot-page{padding:64px 0;}
  @media (min-width:900px) and (min-height:640px){
    html{scroll-snap-type:y proximity;}
    .snap{
      scroll-snap-align:start;
      min-height:100vh;
      display:flex;flex-direction:column;justify-content:center;
      padding:calc(var(--navh) + 12px) 0 28px;
    }
    footer.snap{justify-content:center;}
  }

  /* ---------- Nav ---------- */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:50;height:var(--navh);
    background:rgba(250,250,247,.88);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--light);
  }
  .nav-inner{
    max-width:var(--maxw);margin:0 auto;padding:0 24px;height:100%;
    display:flex;justify-content:space-between;align-items:center;gap:16px;
  }
  .nav-name{font-weight:650;font-size:15px;text-decoration:none;}
  .nav-name b{color:var(--blue);}
  .nav-links{display:flex;gap:22px;align-items:center;}
  .nav-links a{text-decoration:none;font-size:14px;color:var(--grey);transition:color .15s;}
  .nav-links a:hover{color:var(--blue);}
  .nav-cta{
    background:var(--blue);color:#fff !important;padding:8px 18px;border-radius:100px;
    font-weight:500;transition:background .2s;
  }
  .nav-cta:hover{background:var(--blue-dark);}
  .nav-actions{display:flex;align-items:center;gap:10px;}
  .nav-burger{
    display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;
    width:38px;height:38px;border-radius:10px;border:1px solid var(--light);background:var(--card);
    cursor:pointer;padding:0;flex:0 0 auto;
  }
  .nav-burger span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform .25s,opacity .25s;}
  .nav-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .nav-burger.open span:nth-child(2){opacity:0;}
  .nav-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
  .mobile-menu{
    position:absolute;top:100%;left:0;right:0;
    max-height:0;overflow:hidden;background:var(--bg);border-bottom:0 solid var(--light);
    display:flex;flex-direction:column;transition:max-height .3s ease,border-bottom-width .3s ease;
  }
  .mobile-menu a{
    padding:14px 24px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:500;
    border-top:1px solid var(--light);
  }
  .mobile-menu.open{max-height:320px;border-bottom-width:1px;}
  @media (max-width:720px){
    .nav-links{display:none;}
    .nav-burger{display:flex;}
  }
  @media (min-width:721px){
    .mobile-menu{display:none;}
  }
  main{padding-top:var(--navh);}
  @media (min-width:900px) and (min-height:640px){main{padding-top:0;}}

  /* ---------- Hero ---------- */
  .hero-page{position:relative;overflow:clip;}
  .hero-page::before{
    content:"";position:absolute;top:-120px;right:-140px;width:480px;height:480px;
    background:radial-gradient(circle,rgba(31,47,240,.14),transparent 65%);
    border-radius:50%;pointer-events:none;
  }
  .hero-page::after{
    content:"";position:absolute;bottom:-40px;left:-160px;width:380px;height:380px;
    background:radial-gradient(circle,rgba(219,39,119,.09),transparent 65%);
    border-radius:50%;pointer-events:none;
  }
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:13px;letter-spacing:.05em;color:var(--blue);
    border:1px solid rgba(31,47,240,.3);background:var(--blue-tint);
    padding:6px 16px;border-radius:100px;margin-bottom:24px;font-weight:500;
  }
  .kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .hero-page h1{
    font-size:clamp(44px,7.5vw,86px);font-weight:680;
    letter-spacing:-.035em;line-height:1.0;margin-bottom:16px;
  }
  .hero-page h1 em{font-family:Georgia,serif;font-style:italic;font-weight:400;color:var(--blue);}
  .roles{
    font-size:clamp(18px,2.5vw,25px);font-weight:500;letter-spacing:-.01em;
    margin-bottom:22px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  }
  .roles .flip{
    display:inline-block;position:relative;color:var(--blue);
    height:1.45em;overflow:hidden;vertical-align:bottom;min-width:330px;
  }
  .roles .flip span{
    display:block;height:1.45em;line-height:1.45em;
    animation:flipwords 9s cubic-bezier(.6,0,.2,1) infinite;
  }
  @keyframes flipwords{
    0%,26%{transform:translateY(0);}
    33%,59%{transform:translateY(-1.45em);}
    66%,92%{transform:translateY(-2.9em);}
    100%{transform:translateY(-4.35em);}
  }
  @media(max-width:520px){.roles .flip{min-width:240px;}}
  .hero-page p{max-width:560px;font-size:16px;color:var(--grey);}
  .hero-cta{margin-top:28px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:12px 24px;border-radius:100px;font-size:14px;font-weight:500;
    text-decoration:none;border:1px solid var(--ink);
    transition:all .2s;cursor:pointer;background:transparent;color:var(--ink);
  }
  .btn.solid{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.solid:hover{background:var(--blue-dark);border-color:var(--blue-dark);transform:translateY(-2px);}
  .btn:hover{background:var(--ink);color:var(--bg);transform:translateY(-2px);}
  .btn.placeholder{border:1px dashed #c5c5c2;color:#a3a3a0;cursor:default;}
  .btn.placeholder:hover{background:transparent;color:#a3a3a0;transform:none;}

  /* ---------- Marquee ---------- */
  .marquee{
    background:var(--blue);color:#fff;overflow:hidden;white-space:nowrap;
    padding:12px 0;transform:rotate(-1deg) scale(1.04);margin-top:46px;
  }
  @media(max-width:720px){.marquee{transform:none;margin-top:34px;}}
  .marquee-track{display:inline-block;animation:marquee 26s linear infinite;}
  .marquee:hover .marquee-track{animation-play-state:paused;}
  .marquee span{font-size:13.5px;font-weight:500;letter-spacing:.04em;margin:0 16px;}
  .marquee .diamond{opacity:.6;}
  @keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  /* ---------- Section headers ---------- */
  .sec-head{
    display:flex;align-items:baseline;justify-content:space-between;
    border-top:1px solid var(--ink);padding-top:20px;margin-bottom:34px;gap:16px;
  }
  .sec-head h2{
    font-size:clamp(28px,4vw,42px);font-weight:660;
    letter-spacing:-.025em;line-height:1.05;
  }
  .sec-head h2 i{font-family:Georgia,serif;font-weight:400;color:var(--blue);margin-right:10px;font-size:.55em;vertical-align:.35em;letter-spacing:0;}
  .sec-head span{font-size:13px;color:var(--grey);white-space:nowrap;}

  /* ---------- Screenshot frames ---------- */
  .shot{
    position:relative;width:100%;height:100%;
    background:linear-gradient(135deg,var(--acc) 0%,color-mix(in srgb,var(--acc) 55%,#12122e) 100%);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .shot .ph{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:16px;
  }
  .shot .ph .mono{font-family:Georgia,serif;font-style:italic;font-size:clamp(40px,6vw,64px);line-height:1;opacity:.95;}
  .shot .ph .cap{font-size:11px;text-transform:uppercase;letter-spacing:.18em;opacity:.75;font-weight:500;}
  .shot .ph::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 78% 18%,rgba(255,255,255,.22),transparent 45%);
  }
  .shot img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;z-index:2;
  }
  .shot img.fit-contain{object-fit:contain;background:#fff;}
  /* browser frame fills the whole card */
  .frame-browser{
    width:100%;height:100%;overflow:hidden;position:relative;
    display:flex;flex-direction:column;background:#fff;
  }
  .frame-browser .bar{
    height:30px;background:#f0f0f2;border-bottom:1px solid #e2e2e6;flex:0 0 auto;
    display:flex;align-items:center;gap:6px;padding:0 12px;
  }
  .frame-browser .bar .d{width:8px;height:8px;border-radius:50%;}
  .frame-browser .bar .d:nth-child(1){background:#ff5f57;}
  .frame-browser .bar .d:nth-child(2){background:#febc2e;}
  .frame-browser .bar .d:nth-child(3){background:#28c840;}
  .frame-browser .bar .url{
    flex:1;max-width:65%;margin-left:8px;background:#fff;border:1px solid #e2e2e6;
    border-radius:100px;font-size:9px;color:#9a9aa2;padding:2px 10px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .frame-browser .screen{flex:1;position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,white),color-mix(in srgb,var(--acc) 30%,white));}
  .frame-browser .screen .ph{color:var(--acc);}
  .frame-browser .screen .ph::before{display:none;}
  /* phone frame */
  .frame-phone{
    height:88%;aspect-ratio:9/18.5;border-radius:26px;overflow:hidden;position:relative;
    border:6px solid #17171c;background:#fff;box-shadow:0 18px 44px rgba(0,0,0,.32);
  }
  .frame-phone .notch{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    width:38%;height:12px;background:#17171c;border-radius:100px;z-index:4;
  }
  .frame-phone .screen{position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 14%,white),color-mix(in srgb,var(--acc) 32%,white));}
  .frame-phone .screen .ph{color:var(--acc);}
  .frame-phone .screen .ph::before{display:none;}
  .frame-phone .screen .ph .mono{font-size:clamp(30px,4vw,44px);}

  /* ---------- Work carousel ---------- */
  .carousel-shell{position:relative;}
  .carousel{
    display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:6px 4px 18px;scrollbar-width:none;
  }
  .carousel::-webkit-scrollbar{display:none;}
  .card{
    text-decoration:none;display:block;flex:0 0 min(400px,84vw);
    scroll-snap-align:start;
  }
  .card .thumb{
    aspect-ratio:16/10;border-radius:16px;border:1px solid var(--light);
    overflow:hidden;position:relative;
    transition:transform .35s cubic-bezier(.2,.65,.2,1),box-shadow .35s,border-color .3s;
  }
  .card:hover .thumb{border-color:color-mix(in srgb,var(--acc) 40%,white);}
  .card:hover .thumb{
    transform:translateY(-6px) rotate(-.6deg);
    box-shadow:0 18px 40px color-mix(in srgb,var(--acc) 30%,transparent);
  }
  .card .tag{
    position:absolute;top:14px;left:14px;font-size:12px;font-weight:600;z-index:5;
    background:rgba(255,255,255,.92);color:var(--acc);padding:4px 12px;border-radius:100px;letter-spacing:.03em;
  }
  .card .idx{
    position:absolute;bottom:10px;right:12px;font-family:Georgia,serif;font-style:italic;
    font-size:13px;color:#fff;z-index:5;
    background:rgba(16,16,20,.55);padding:2px 11px;border-radius:100px;
    backdrop-filter:blur(4px);
  }
  .card h3{font-size:16.5px;font-weight:600;letter-spacing:-.01em;margin-top:14px;}
  .card .meta{font-size:13px;color:var(--grey);margin-top:3px;}
  .card .arrow{display:inline-block;margin-left:6px;transition:transform .25s;color:var(--acc);}
  .card:hover .arrow{transform:translateX(4px);}
  .car-btn{
    position:absolute;top:34%;width:46px;height:46px;border-radius:50%;
    border:1px solid var(--light);background:var(--card);cursor:pointer;
    font-size:17px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.08);transition:all .2s;z-index:5;color:var(--ink);
  }
  .car-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
  .car-btn.prev{left:-14px;}
  .car-btn.next{right:-14px;}
  @media(max-width:640px){
    .car-btn.prev{left:2px;}.car-btn.next{right:2px;}
    .carousel{gap:16px;padding:6px 0 18px;}
    .card{flex-basis:100%;}
  }

  /* ---------- About ---------- */
  .about-grid{display:grid;grid-template-columns:320px 1fr;gap:52px;align-items:center;}
  @media(max-width:760px){.about-grid{grid-template-columns:1fr;gap:40px;justify-items:center;}}
  .about-text{font-size:16.5px;line-height:1.65;}
  .about-text + .about-text{margin-top:16px;}
  .about-text mark{background:linear-gradient(transparent 62%,rgba(31,47,240,.18) 62%);color:inherit;padding:0 2px;}
  /* photo composition */
  .me-wrap{position:relative;max-width:320px;width:100%;}
  .me-wrap::before{
    content:"";position:absolute;inset:0;border-radius:20px;
    background:linear-gradient(135deg,var(--blue),#4a2fe0);
    transform:rotate(4deg);transition:transform .4s cubic-bezier(.2,.65,.2,1);
  }
  .me-wrap:hover::before{transform:rotate(1.5deg);}
  .me-frame{
    position:relative;border-radius:20px;overflow:hidden;
    transform:rotate(-2.5deg);transition:transform .4s cubic-bezier(.2,.65,.2,1);
    box-shadow:0 16px 38px rgba(0,0,0,.14);
  }
  .me-wrap:hover .me-frame{transform:rotate(0);}
  .me-frame img{display:block;width:100%;height:auto;}
  .me-chip{
    position:absolute;background:#fff;border:1px solid var(--light);
    box-shadow:0 8px 22px rgba(0,0,0,.1);border-radius:100px;
    padding:7px 16px;font-size:13px;font-weight:600;z-index:3;white-space:nowrap;
  }
  .me-chip.c1{top:12px;right:-26px;transform:rotate(6deg);color:var(--blue);}
  .me-chip.c2{bottom:16px;left:-24px;transform:rotate(-5deg);}
  @media(max-width:760px){.me-chip.c1{right:8px;}.me-chip.c2{left:8px;}}
  /* right now list */
  .now{margin-top:26px;border-top:1px solid var(--light);padding-top:18px;}
  .now-title{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--blue);font-weight:650;margin-bottom:10px;}
  .now ul{list-style:none;}
  .now li{font-size:15px;line-height:1.6;padding:6px 0 6px 24px;position:relative;color:var(--ink);}
  .now li::before{content:"→";position:absolute;left:0;color:var(--blue);font-size:13px;top:8px;}

  /* ---------- Skills ---------- */
  .skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:880px){.skills-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.skills-grid{grid-template-columns:1fr;}}
  .skill-card{
    background:var(--card);border:1px solid var(--light);border-radius:16px;
    padding:22px;position:relative;overflow:hidden;
    transition:transform .3s cubic-bezier(.2,.6,.2,1),border-color .3s,box-shadow .3s;
  }
  .skill-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--acc);}
  .skill-card:hover{
    transform:translateY(-5px);border-color:color-mix(in srgb,var(--acc) 45%,white);
    box-shadow:0 14px 32px color-mix(in srgb,var(--acc) 12%,transparent);
  }
  .skill-card .num{font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--acc);}
  .skill-card .cat{font-size:15.5px;font-weight:600;margin:4px 0 12px;letter-spacing:-.01em;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font-size:12.5px;padding:4px 12px;border-radius:100px;
    border:1px solid color-mix(in srgb,var(--acc) 30%,white);
    background:color-mix(in srgb,var(--acc) 6%,white);color:var(--ink);
    transition:all .2s;
  }
  .skill-card:hover .chip{border-color:color-mix(in srgb,var(--acc) 55%,white);}

  /* ---------- Experience tabs ---------- */
  .xp-tabs{display:grid;grid-template-columns:290px 1fr;gap:30px;align-items:start;}
  @media(max-width:760px){.xp-tabs{grid-template-columns:1fr;}}
  .xp-nav{display:flex;flex-direction:column;gap:8px;}
  @media(max-width:760px){
    .xp-nav{flex-direction:row;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
    .xp-nav::-webkit-scrollbar{display:none;}
    .xp-btn{flex:0 0 auto;}
    .xp-btn small{display:none;}
    .xp-btn .yr{display:none;}
  }
  .xp-btn{
    text-align:left;padding:13px 16px;border-radius:12px;cursor:pointer;
    border:1px solid var(--light);background:var(--card);
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);
    transition:all .2s;display:flex;justify-content:space-between;align-items:center;gap:8px;
  }
  .xp-btn small{display:block;font-weight:400;color:var(--grey);font-size:12.5px;}
  .xp-btn .yr{font-family:Georgia,serif;font-style:italic;font-size:13px;color:var(--grey);white-space:nowrap;}
  .xp-btn:hover{border-color:var(--blue);}
  .xp-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .xp-btn.active small,.xp-btn.active .yr{color:rgba(255,255,255,.75);}
  .xp-panel{
    background:var(--card);border:1px solid var(--light);border-radius:16px;
    padding:26px 28px;display:none;animation:fade .4s ease;
  }
  .xp-panel.active{display:block;}
  .xp-panel .role{font-size:21px;font-weight:650;letter-spacing:-.02em;}
  .xp-panel .org{font-size:15px;color:var(--blue);font-weight:500;margin-top:3px;}
  .xp-panel .dt{font-size:13px;color:var(--grey);margin-top:2px;}
  .xp-panel ul{list-style:none;margin-top:14px;}
  .xp-panel li{
    font-size:14.5px;line-height:1.6;padding:8px 0 8px 24px;position:relative;
    border-bottom:1px solid var(--light);
  }
  .xp-panel li:last-child{border-bottom:none;}
  .xp-panel li::before{content:"→";position:absolute;left:0;color:var(--blue);font-size:13px;top:10px;}

  /* ---------- Education ---------- */
  .edu-highlight{
    background:linear-gradient(135deg,var(--blue) 0%,#4a2fe0 100%);
    color:#fff;border-radius:18px;
    padding:30px 32px;display:flex;justify-content:space-between;
    gap:24px;flex-wrap:wrap;margin-bottom:26px;position:relative;overflow:hidden;
  }
  .edu-highlight::after{
    content:"◆";position:absolute;right:-30px;bottom:-55px;font-size:200px;opacity:.08;
  }
  .edu-highlight .deg{font-size:clamp(21px,3vw,29px);font-weight:660;letter-spacing:-.02em;line-height:1.15;}
  .edu-highlight .school{color:rgba(255,255,255,.8);margin-top:5px;font-size:14.5px;}
  .edu-highlight .desc{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:14px;max-width:560px;line-height:1.65;}
  .edu-highlight .date{color:rgba(255,255,255,.65);font-size:13px;white-space:nowrap;padding-top:8px;}
  .edu-highlight .badge{
    display:inline-block;margin-top:14px;padding:6px 15px;
    border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);
    border-radius:100px;font-size:12px;letter-spacing:.03em;
  }
  .edu-tab-btns{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .pill-btn{
    padding:8px 20px;border-radius:100px;border:1px solid var(--light);
    background:var(--card);font-family:inherit;font-size:13.5px;font-weight:500;
    cursor:pointer;color:var(--grey);transition:all .2s;
  }
  .pill-btn:hover{border-color:var(--blue);color:var(--blue);}
  .pill-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .edu-pane{display:none;animation:fade .4s ease;}
  .edu-pane.active{display:block;}
  .plain-list{list-style:none;}
  .plain-list li{

function shotHTML(p){
  const placeholder = `<div class="ph"><div class="mono">${p.mono}</div><div class="cap">${p.type}</div></div>`;
  const img = `<img src="${p.img}" alt="${p.title} screenshot" loading="lazy" class="${p.fit === "contain" ? "fit-contain" : ""}" onerror="this.remove()">`;
  if(p.frame === "phone"){
    return `<div class="shot" title="Add your screenshot at ${p.img}">
      <div class="frame-phone"><div class="notch"></div><div class="screen">${placeholder}${img}</div></div>
    </div>`;
  }
  return `<div class="shot" title="Add your screenshot at ${p.img}">
    <div class="frame-browser">
      <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="url">${p.site}</span></div>
      <div class="screen">${placeholder}${img}</div>
    </div>
  </div>`;
}

/* ---------- Project detail page ----------
   Link rules: a URL string renders a button, "soon" renders a
   dashed placeholder, null hides the button entirely. */
function linkButtons(p){
  let out = "";
  if(p.live) out += `<a class="btn solid" href="${p.live}" target="_blank" rel="noopener">${p.liveLabel || "View live app ↗"}</a>`;
  if(p.github === "soon") out += `<span class="btn placeholder">GitHub, link coming soon</span>`;
  else if(p.github) out += `<a class="btn" href="${p.github}" target="_blank" rel="noopener">GitHub ↗</a>`;
  if(p.video === "soon") out += `<span class="btn placeholder">Video, coming soon</span>`;
  else if(p.video) out += `<a class="btn" href="${p.video}" target="_blank" rel="noopener">Watch video ↗</a>`;
  return out;
}

function projectHTML(p){
  const i = PROJECTS.indexOf(p);
  const prev = PROJECTS[(i - 1 + PROJECTS.length) % PROJECTS.length];
  const next = PROJECTS[(i + 1) % PROJECTS.length];
  const links = linkButtons(p);
  return `
  <div class="detail wrap fade" style="--acc:${p.accent}">
    <a class="back" href="#/">← Back to all work</a>
    <div class="ptag">${p.type} · ${String(i+1).padStart(2,"0")} / 06</div>
    <h1>${p.title}</h1>
    <p class="sub">${p.short}</p>
    <div class="meta-bar">
      <div><b>Type</b><span>${p.type}</span></div>
      <div><b>Timeline</b><span>${p.date}</span></div>
      <div><b>Tools</b><span>${p.tools}</span></div>
    </div>
    <div class="detail-hero">${shotHTML(p)}</div>
    <div class="detail-sec"><h3><i>a.</i>Overview</h3><p>${p.overview}</p></div>
    <div class="detail-sec"><h3><i>b.</i>What I did</h3><ul>${p.points.map(x=>`<li>${x}</li>`).join("")}</ul></div>
    <div class="detail-sec"><h3><i>c.</i>Outcome</h3><p>${p.outcome}</p></div>
    ${links ? `<div class="detail-sec"><h3><i>d.</i>Links</h3><div class="link-row">${links}</div></div>` : ""}
    <div class="pager">
      <a href="#/project/${prev.slug}">← Previous<b>${prev.title}</b></a>
      <a href="#/project/${next.slug}" style="text-align:right;">Next →<b>${next.title}</b></a>
    </div>
  </div>`;
}

/* ---------- Interactions ---------- */
function slideWork(dir){
  const c = document.getElementById("workCarousel");
  if(!c) return;
  const card = c.querySelector(".card");
  if(!card){ c.scrollBy({left:dir*424,behavior:"smooth"}); return; }
  const gap = parseFloat(getComputedStyle(c).columnGap || getComputedStyle(c).gap) || 0;
  c.scrollBy({left:dir*(card.getBoundingClientRect().width+gap),behavior:"smooth"});
}

function showXp(i){
  document.querySelectorAll(".xp-btn").forEach(b=>b.classList.toggle("active",b.getAttribute("data-xp")==String(i)));
  document.querySelectorAll(".xp-panel").forEach(p=>p.classList.toggle("active",p.getAttribute("data-xp-panel")==String(i)));
}

function toggleMenu(){
  const menu = document.getElementById("mobileMenu");
  const btn = document.getElementById("navBurger");
  const isOpen = menu.classList.toggle("open");
  btn.classList.toggle("open", isOpen);
  btn.setAttribute("aria-expanded", String(isOpen));
}

function closeMenu(){
  document.getElementById("mobileMenu").classList.remove("open");
  document.getElementById("navBurger").classList.remove("open");
  document.getElementById("navBurger").setAttribute("aria-expanded","false");
}

function showEdu(key){
  document.querySelectorAll(".pill-btn").forEach(b=>b.classList.toggle("active",b.getAttribute("data-edu")===key));
  document.querySelectorAll(".edu-pane").forEach(p=>p.classList.toggle("active",p.getAttribute("data-edu-pane")===key));
}

/* ---------- Router ---------- */
const app = document.getElementById("app");
let pendingSection = null;

function initReveals(){
  const els = document.querySelectorAll(".reveal:not(.visible)");
  if(!("IntersectionObserver" in window)){
    els.forEach(el=>el.classList.add("visible"));
    return;
  }
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(en.isIntersecting){
        en.target.classList.add("visible");
        io.unobserve(en.target);
      }
    });
  },{threshold:0.12,rootMargin:"0px 0px -6% 0px"});
  els.forEach(el=>io.observe(el));
}

function render(){
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/project\/(.+)$/);
  if(m){
    const p = PROJECTS.find(x=>x.slug===m[1]);
    app.innerHTML = p ? projectHTML(p) : homeHTML();
  } else {
    app.innerHTML = homeHTML();
  }
  if(pendingSection){
    const el = document.getElementById(pendingSection);
    pendingSection = null;
    if(el){ el.scrollIntoView({behavior:"smooth"}); initReveals(); return; }
  }
  window.scrollTo(0,0);
  initReveals();
}

function goSection(id){
  if(location.hash && location.hash !== "#/"){
    pendingSection = id;
    location.hash = "#/";
  } else {
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:"smooth"});
  }
}

window.addEventListener("hashchange", render);
render();
</script>
